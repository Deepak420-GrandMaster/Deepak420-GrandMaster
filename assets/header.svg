<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Deepak Prajapati, Data and Analytics Engineer at TravelJuice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1F7"/>
      <stop offset="0.5" stop-color="#F4EEFF"/>
      <stop offset="1" stop-color="#E6F5FF"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B8FF"/>
      <stop offset="1" stop-color="#E6DEFF"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB8D6"/>
      <stop offset="1" stop-color="#FFE0EE"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9DDF7"/>
      <stop offset="1" stop-color="#DDF2FC"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8B7BC8" flood-opacity="0.20"/>
    </filter>
    <clipPath id="clip"><rect width="1000" height="300" rx="28"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      .float3 { animation: f3 13s ease-in-out infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(24px,18px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,14px); } }
      @keyframes f3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(16px,-22px); } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3.6s ease-in-out infinite; }
      .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; } .b4 { animation-delay: .75s; } .b5 { animation-delay: 1s; }
      @keyframes grow { 0%,100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.7); opacity: .35; } }
      .draw { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 4s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 260; } 55%,100% { stroke-dashoffset: 0; } }
      .rise { animation: rise 1s ease-out both; }
      .r2 { animation-delay: .15s; } .r3 { animation-delay: .3s; } .r4 { animation-delay: .45s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="float1" cx="150" cy="60" r="90" fill="#FFC9DE" opacity="0.75"/>
      <circle class="float2" cx="560" cy="270" r="100" fill="#C9E7FF" opacity="0.8"/>
      <circle class="float3" cx="880" cy="40" r="90" fill="#D9CCFF" opacity="0.8"/>
      <circle class="float1" cx="760" cy="240" r="70" fill="#C8F0DE" opacity="0.7"/>
    </g>
    <!-- soft dot grid -->
    <g fill="#B9A6F5" opacity="0.22">
      <circle cx="40" cy="262" r="2"/><circle cx="64" cy="262" r="2"/><circle cx="88" cy="262" r="2"/><circle cx="112" cy="262" r="2"/>
      <circle cx="40" cy="238" r="2"/><circle cx="64" cy="238" r="2"/><circle cx="88" cy="238" r="2"/><circle cx="112" cy="238" r="2"/>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="27" fill="none" stroke="#E4DAFF" stroke-width="2"/>

  <!-- left copy -->
  <g class="sans">
    <text class="mono rise" x="56" y="58" font-size="13" fill="#8A7BC4" letter-spacing="1.5">~/deepak/profile.overview</text>

    <g class="rise r2">
      <rect x="56" y="76" width="318" height="30" rx="15" fill="#DDF6EA" stroke="#A8E0C5"/>
      <circle class="pulse" cx="76" cy="91" r="5" fill="#4CC38A"/>
      <text x="92" y="96" font-size="13" font-weight="600" fill="#2F7A57">available immediately · open to opportunities</text>
    </g>

    <text class="rise r2" x="54" y="165" font-size="56" font-weight="800" fill="#3B3552" letter-spacing="-1.5">Deepak Prajapati</text>
    <text class="rise r3" x="56" y="203" font-size="22" font-weight="600" fill="#6B5FA8">Data &amp; Analytics Engineer @ TravelJuice</text>
    <text class="rise r4 mono" x="56" y="238" font-size="14" fill="#7A7394">pipelines · tracking · dashboards · agentic AI<tspan class="cursor" fill="#B9A6F5"> ▌</tspan></text>
  </g>

  <!-- right: floating dashboard card -->
  <g filter="url(#shadow)">
    <g class="float3">
      <rect x="640" y="38" width="300" height="214" rx="22" fill="#FFFFFF" fill-opacity="0.88" stroke="#EDE6FF"/>
      <circle cx="664" cy="62" r="5" fill="#FFB8D6"/>
      <circle cx="682" cy="62" r="5" fill="#FFE29A"/>
      <circle cx="700" cy="62" r="5" fill="#A8E0C5"/>
      <text class="mono" x="780" y="66" font-size="11" fill="#9C93BA">funnel.overview</text>

      <g>
        <rect class="bar" x="668" y="112" width="28" height="86" rx="8" fill="url(#barA)"/>
        <rect class="bar b2" x="706" y="96" width="28" height="102" rx="8" fill="url(#barB)"/>
        <rect class="bar b3" x="744" y="124" width="28" height="74" rx="8" fill="url(#barC)"/>
        <rect class="bar b4" x="782" y="88" width="28" height="110" rx="8" fill="url(#barA)"/>
        <rect class="bar b5" x="820" y="108" width="28" height="90" rx="8" fill="url(#barB)"/>
        <rect class="bar" x="858" y="130" width="28" height="68" rx="8" fill="url(#barC)"/>
      </g>
      <line x1="660" y1="200" x2="920" y2="200" stroke="#EDE6FF" stroke-width="2"/>
      <path class="draw" d="M668 150 C 700 118, 724 168, 758 130 S 820 96, 840 118 S 886 100, 900 92" fill="none" stroke="#8B7BE0" stroke-width="3" stroke-linecap="round"/>
      <circle class="pulse" cx="900" cy="92" r="5" fill="#8B7BE0"/>

      <rect x="664" y="214" width="112" height="24" rx="12" fill="#F4EEFF"/>
      <text class="mono" x="676" y="230" font-size="11" fill="#6B5FA8">BigQuery ✓</text>
      <rect x="784" y="214" width="136" height="24" rx="12" fill="#FFE8F1"/>
      <text class="mono" x="796" y="230" font-size="11" fill="#B04A7C">GA4 → Looker</text>
    </g>
  </g>

  <!-- floating agent chip -->
  <g filter="url(#shadow)">
    <g class="float2">
      <rect x="520" y="254" width="170" height="36" rx="18" fill="#FFFFFF" stroke="#DDF2FC"/>
      <circle cx="542" cy="272" r="9" fill="#C9E7FF"/>
      <text class="mono" x="535.5" y="275.5" font-size="10" fill="#3B7FA8" font-weight="700">AI</text>
      <text class="mono" x="560" y="276" font-size="11.5" fill="#4B5C78">agent.plan_trip()</text>
    </g>
  </g>
</svg>
