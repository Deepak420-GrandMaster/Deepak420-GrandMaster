<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Deepak Prajapati, Data and Analytics Engineer at TravelJuice, creating AI agents and building more in AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F5EE"/>
      <stop offset="1" stop-color="#EEE5D6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8956A"/>
      <stop offset="1" stop-color="#7A5C3A"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6B5434" flood-opacity="0.14"/>
    </filter>
    <clipPath id="clip"><rect width="1000" height="340" rx="32"/></clipPath>
    <style>
      .sf { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .drift { animation: drift 16s ease-in-out infinite; }
      @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,16px); } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 4.4s ease-in-out infinite; }
      .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; } .b4 { animation-delay: .9s; } .b5 { animation-delay: 1.2s; }
      @keyframes grow { 0%,100% { transform: scaleY(.62); } 50% { transform: scaleY(1); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .3; } }
      .draw { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 5s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 260; } 55%,100% { stroke-dashoffset: 0; } }
      .dot { animation: typing 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; }
      @keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-3px); opacity: 1; } }
      .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
      .r2 { animation-delay: .12s; } .r3 { animation-delay: .24s; } .r4 { animation-delay: .36s; } .r5 { animation-delay: .48s; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="drift" cx="860" cy="290" r="110" fill="#D9C3A0" opacity="0.55"/>
      <circle cx="120" cy="40" r="100" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="338.5" rx="31.5" fill="none" stroke="#E4D9C6" stroke-width="1.5"/>

  <!-- copy -->
  <g class="sf">
    <g class="rise">
      <rect x="56" y="62" width="214" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.75" stroke="#E4D9C6"/>
      <circle class="pulse" cx="76" cy="77" r="4.5" fill="#34C759"/>
      <text x="92" y="82" font-size="13" font-weight="600" fill="#4A4339">Available immediately</text>
    </g>

    <text class="rise r2" x="53" y="176" font-size="60" font-weight="700" fill="#1D1B18" letter-spacing="-2.2">Deepak Prajapati</text>
    <text class="rise r3" x="56" y="216" font-size="23" font-weight="500" fill="#6E675D" letter-spacing="-0.2">Data &amp; Analytics Engineer at TravelJuice</text>
    <text class="rise r4" x="56" y="254" font-size="15" font-weight="500" fill="#A39B8E" letter-spacing="0.2">Pipelines  ·  Tracking  ·  Dashboards  ·  AI agents</text>
    <text class="rise r5" x="56" y="282" font-size="15" font-weight="600" fill="#7A5C3A" letter-spacing="0.1">Creating AI agents, and building more in AI.</text>
  </g>

  <!-- dashboard + AI card -->
  <g filter="url(#shadow)">
    <rect x="650" y="36" width="300" height="270" rx="26" fill="#FFFDF9" fill-opacity="0.92" stroke="#EADFCF"/>
  </g>
  <g class="sf">
    <circle cx="676" cy="62" r="4.5" fill="#E3D9C7"/>
    <circle cx="692" cy="62" r="4.5" fill="#E3D9C7"/>
    <circle cx="708" cy="62" r="4.5" fill="#E3D9C7"/>
    <text x="924" y="66" font-size="11.5" font-weight="600" fill="#A39B8E" text-anchor="end">Funnel overview</text>

    <rect class="bar" x="676" y="114" width="28" height="56" rx="8" fill="#E3D6BF"/>
    <rect class="bar b2" x="714" y="100" width="28" height="70" rx="8" fill="#D1BA95"/>
    <rect class="bar b3" x="752" y="120" width="28" height="50" rx="8" fill="#E3D6BF"/>
    <rect class="bar b4" x="790" y="88" width="28" height="82" rx="8" fill="#B8956A"/>
    <rect class="bar b5" x="828" y="106" width="28" height="64" rx="8" fill="#D1BA95"/>
    <rect class="bar" x="866" y="124" width="28" height="46" rx="8" fill="#E3D6BF"/>
    <line x1="668" y1="172" x2="932" y2="172" stroke="#EADFCF" stroke-width="2"/>
    <path class="draw" d="M676 140 C 706 112, 730 150, 764 124 S 826 92, 846 110 S 892 98, 908 88" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <circle class="pulse" cx="908" cy="88" r="5" fill="#7A5C3A"/>

    <rect x="672" y="184" width="112" height="24" rx="12" fill="#F3ECDF"/>
    <text x="728" y="200" font-size="11.5" font-weight="600" fill="#6E675D" text-anchor="middle">BigQuery</text>
    <rect x="792" y="184" width="132" height="24" rx="12" fill="#F3ECDF"/>
    <text x="858" y="200" font-size="11.5" font-weight="600" fill="#6E675D" text-anchor="middle">GA4 → Looker Studio</text>

    <!-- AI section -->
    <line x1="676" y1="224" x2="924" y2="224" stroke="#EADFCF"/>
    <text x="676" y="248" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#9C7A54">AI AGENTS</text>
    <text x="898" y="248" font-size="11" font-weight="500" fill="#A39B8E" text-anchor="end">Building more in AI</text>
    <circle class="dot" cx="906" cy="244.5" r="2.4" fill="#9C7A54"/>
    <circle class="dot d2" cx="914" cy="244.5" r="2.4" fill="#9C7A54"/>
    <circle class="dot d3" cx="922" cy="244.5" r="2.4" fill="#9C7A54"/>

    <rect x="676" y="260" width="72" height="26" rx="13" fill="#2B2620"/>
    <text x="712" y="277" font-size="11.5" font-weight="600" fill="#F5EFE4" text-anchor="middle">AI agents</text>
    <rect x="756" y="260" width="84" height="26" rx="13" fill="#EFE3D0"/>
    <text x="798" y="277" font-size="11.5" font-weight="600" fill="#7A5C3A" text-anchor="middle">RAG · evals</text>
    <rect x="848" y="260" width="76" height="26" rx="13" fill="#EFE3D0"/>
    <text x="886" y="277" font-size="11.5" font-weight="600" fill="#7A5C3A" text-anchor="middle">Fine-tuning</text>
  </g>
</svg>
