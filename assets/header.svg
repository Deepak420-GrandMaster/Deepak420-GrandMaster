<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Deepak Prajapati, Data and Analytics Engineer at TravelJuice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F5EE"/>
      <stop offset="1" stop-color="#EEE5D6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8956A"/>
      <stop offset="1" stop-color="#7A5C3A"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6B5434" flood-opacity="0.14"/>
    </filter>
    <clipPath id="clip"><rect width="1000" height="300" rx="32"/></clipPath>
    <style>
      .sf { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
      .drift { animation: drift 16s ease-in-out infinite; }
      @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,16px); } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 4.4s ease-in-out infinite; }
      .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; } .b4 { animation-delay: .9s; } .b5 { animation-delay: 1.2s; }
      @keyframes grow { 0%,100% { transform: scaleY(.62); } 50% { transform: scaleY(1); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .3; } }
      .draw { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 5s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 260; } 55%,100% { stroke-dashoffset: 0; } }
      .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
      .r2 { animation-delay: .12s; } .r3 { animation-delay: .24s; } .r4 { animation-delay: .36s; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="drift" cx="860" cy="250" r="110" fill="#D9C3A0" opacity="0.55"/>
      <circle cx="120" cy="40" r="100" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="298.5" rx="31.5" fill="none" stroke="#E4D9C6" stroke-width="1.5"/>

  <!-- copy -->
  <g class="sf">
    <g class="rise">
      <rect x="56" y="52" width="214" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.75" stroke="#E4D9C6"/>
      <circle class="pulse" cx="76" cy="67" r="4.5" fill="#34C759"/>
      <text x="92" y="72" font-size="13" font-weight="600" fill="#4A4339">Available immediately</text>
    </g>

    <text class="rise r2" x="53" y="156" font-size="60" font-weight="700" fill="#1D1B18" letter-spacing="-2.2">Deepak Prajapati</text>
    <text class="rise r3" x="56" y="196" font-size="23" font-weight="500" fill="#6E675D" letter-spacing="-0.2">Data &amp; Analytics Engineer at TravelJuice</text>
    <text class="rise r4" x="56" y="236" font-size="15" font-weight="500" fill="#A39B8E" letter-spacing="0.2">Pipelines  ·  Tracking  ·  Dashboards  ·  Agentic AI</text>
  </g>

  <!-- dashboard card -->
  <g filter="url(#shadow)">
    <rect x="650" y="42" width="300" height="206" rx="26" fill="#FFFDF9" fill-opacity="0.9" stroke="#EADFCF"/>
  </g>
  <g class="sf">
    <circle cx="676" cy="68" r="4.5" fill="#E3D9C7"/>
    <circle cx="692" cy="68" r="4.5" fill="#E3D9C7"/>
    <circle cx="708" cy="68" r="4.5" fill="#E3D9C7"/>
    <text x="924" y="72" font-size="11.5" font-weight="600" fill="#A39B8E" text-anchor="end">Funnel overview</text>

    <rect class="bar" x="676" y="124" width="28" height="70" rx="8" fill="#E3D6BF"/>
    <rect class="bar b2" x="714" y="108" width="28" height="86" rx="8" fill="#D1BA95"/>
    <rect class="bar b3" x="752" y="132" width="28" height="62" rx="8" fill="#E3D6BF"/>
    <rect class="bar b4" x="790" y="96" width="28" height="98" rx="8" fill="#B8956A"/>
    <rect class="bar b5" x="828" y="116" width="28" height="78" rx="8" fill="#D1BA95"/>
    <rect class="bar" x="866" y="138" width="28" height="56" rx="8" fill="#E3D6BF"/>
    <line x1="668" y1="196" x2="932" y2="196" stroke="#EADFCF" stroke-width="2"/>
    <path class="draw" d="M676 152 C 706 122, 730 164, 764 134 S 826 100, 846 120 S 892 106, 908 96" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
    <circle class="pulse" cx="908" cy="96" r="5" fill="#7A5C3A"/>

    <rect x="672" y="210" width="112" height="24" rx="12" fill="#F3ECDF"/>
    <text x="728" y="226" font-size="11.5" font-weight="600" fill="#6E675D" text-anchor="middle">BigQuery</text>
    <rect x="792" y="210" width="132" height="24" rx="12" fill="#F3ECDF"/>
    <text x="858" y="226" font-size="11.5" font-weight="600" fill="#6E675D" text-anchor="middle">GA4 → Looker Studio</text>
  </g>

  <!-- floating chip -->
  <g filter="url(#shadow)">
    <rect x="520" y="254" width="172" height="34" rx="17" fill="#FFFDF9" stroke="#EADFCF"/>
  </g>
  <circle cx="540" cy="271" r="9" fill="#EFE6D6"/>
  <text class="sf" x="540" y="274.5" font-size="9.5" font-weight="700" fill="#7A5C3A" text-anchor="middle">AI</text>
  <text class="mono" x="558" y="275" font-size="11.5" fill="#6E675D">agent.plan_trip()</text>
</svg>
