<svg xmlns="http://www.w3.org/2000/svg" width="310" height="250" viewBox="0 0 310 250" role="img" aria-label="SQL-Project">
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#6B5434" flood-opacity="0.10"/>
    </filter>
    <style>
      .sf { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.6px; }
      .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

      .card { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    </style>
  </defs>
  <g class="card" filter="url(#s)">
    <rect x="6" y="4" width="298" height="236" rx="22" fill="#FFFDF9" stroke="#E4D9C6"/>
  </g>
  <circle cx="46" cy="48" r="16" fill="#F3ECDF"/>
  <path d="M40 44l-5 4 5 4M52 44l5 4-5 4" fill="none" stroke="#9C7A54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sf" x="72" y="53" font-size="15" font-weight="700" fill="#1D1B18" letter-spacing="-0.2">SQL-Project</text>
  <path d="M270 50l10 -10m0 0h-7m7 0v7" fill="none" stroke="#A39B8E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="sf" x="28" y="98" font-size="13.5" fill="#6E675D">SQL analytics on automotive and call-</text><text class="sf" x="28" y="118" font-size="13.5" fill="#6E675D">centre data: pricing trends, window</text><text class="sf" x="28" y="138" font-size="13.5" fill="#6E675D">functions, CTEs.</text>
  
  <rect x="28.0" y="196" width="44.7" height="26" rx="13" fill="#F5EFE4" stroke="#E6DCCB"/><text class="sf" x="50.4" y="213" font-size="11.5" font-weight="500" fill="#4A4339" text-anchor="middle">SQL</text><rect x="80.7" y="196" width="134.4" height="26" rx="13" fill="#F5EFE4" stroke="#E6DCCB"/><text class="sf" x="147.9" y="213" font-size="11.5" font-weight="500" fill="#4A4339" text-anchor="middle">Window functions</text><rect x="223.1" y="196" width="51.6" height="26" rx="13" fill="#F5EFE4" stroke="#E6DCCB"/><text class="sf" x="248.9" y="213" font-size="11.5" font-weight="500" fill="#4A4339" text-anchor="middle">CTEs</text>
</svg>
