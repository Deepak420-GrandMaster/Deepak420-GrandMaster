<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="What I do and what I am building">
  <defs>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A97C"/>
      <stop offset="1" stop-color="#EBD9B8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6B5434" flood-opacity="0.10"/>
    </filter>
    <style>
      .sf { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.6px; }
      .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
      .r2 { animation-delay: .1s; } .r3 { animation-delay: .2s; } .r4 { animation-delay: .3s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .fill { transform-box: fill-box; transform-origin: left; animation: fillbar 2.4s cubic-bezier(.2,.8,.2,1) both .5s; }
      @keyframes fillbar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="998.5" height="358.5" rx="31.5" fill="#F5F0E8" stroke="#E4D9C6" stroke-width="1.5"/>

  <!-- LEFT: what I do -->
  <g filter="url(#shadow)"><rect x="24" y="24" width="580" height="312" rx="26" fill="#FFFDF9"/></g>
  <g class="sf">
    <text class="eyebrow" x="52" y="58" fill="#9C7A54">WHAT I DO</text>
    <text x="52" y="86" font-size="21" font-weight="700" fill="#1D1B18" letter-spacing="-0.4">What I build, and how I ship it</text>

    <g transform="translate(0,-6)">
    <g class="rise">
      <circle cx="74" cy="132" r="17" fill="#F3ECDF"/>
      <path d="M66 127h16M66 132h16M66 137h10" stroke="#8C6B47" stroke-width="2" stroke-linecap="round"/>
      <text x="104" y="128" font-size="16" font-weight="600" fill="#1D1B18">Pipelines &amp; warehousing</text>
      <text x="104" y="148" font-size="13.5" fill="#6E675D">BigQuery analytics infrastructure, end to end</text>
    </g>
    <line x1="52" y1="162" x2="576" y2="162" stroke="#F0E8DA"/>

    <g class="rise r2">
      <circle cx="74" cy="192" r="17" fill="#F3ECDF"/>
      <path d="M66 192l5.5 5.5L83 186" fill="none" stroke="#8C6B47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="188" font-size="16" font-weight="600" fill="#1D1B18">Tracking &amp; consent</text>
      <text x="104" y="208" font-size="13.5" fill="#6E675D">GA4 / GTM, server-side tagging, Consent Mode V2</text>
    </g>
    <line x1="52" y1="222" x2="576" y2="222" stroke="#F0E8DA"/>

    <g class="rise r3">
      <circle cx="74" cy="252" r="17" fill="#F3ECDF"/>
      <rect x="66" y="253" width="4" height="8" rx="1.5" fill="#8C6B47"/>
      <rect x="73" y="246" width="4" height="15" rx="1.5" fill="#8C6B47"/>
      <rect x="80" y="241" width="4" height="20" rx="1.5" fill="#8C6B47"/>
      <text x="104" y="248" font-size="16" font-weight="600" fill="#1D1B18">BI &amp; dashboards</text>
      <text x="104" y="268" font-size="13.5" fill="#6E675D">Looker Studio, Power BI, Apache Superset</text>
    </g>
    <line x1="52" y1="282" x2="576" y2="282" stroke="#F0E8DA"/>

    <g class="rise r4">
      <circle cx="74" cy="312" r="17" fill="#F3ECDF"/>
      <circle cx="74" cy="312" r="3.2" fill="#8C6B47"/>
      <circle cx="66" cy="306" r="2.3" fill="#8C6B47"/><circle cx="82" cy="306" r="2.3" fill="#8C6B47"/>
      <circle cx="66" cy="318" r="2.3" fill="#8C6B47"/><circle cx="82" cy="318" r="2.3" fill="#8C6B47"/>
      <path d="M66 306L74 312L82 306M66 318L74 312L82 318" stroke="#8C6B47" stroke-width="1.2" fill="none"/>
      <text x="104" y="308" font-size="16" font-weight="600" fill="#1D1B18">AI agents</text>
      <text x="104" y="328" font-size="13.5" fill="#6E675D">Creating agents, RAG assistants and planners grounded in real data</text>
    </g>
    </g>
  </g>

  <!-- RIGHT TOP: dark card -->
  <g filter="url(#shadow)"><rect x="624" y="24" width="352" height="196" rx="26" fill="#2B2620"/></g>
  <g class="sf">
    <text class="eyebrow" x="650" y="58" fill="#C9A97C">NOW BUILDING</text>
    <text x="650" y="98" font-size="28" font-weight="700" fill="#F5EFE4" letter-spacing="-0.7">Second Brain</text>
    <text x="650" y="122" font-size="13" fill="#A89F90">A personal data system for reflection and analysis</text>

    <line x1="650" y1="142" x2="950" y2="142" stroke="#4A4238"/>

    <text class="eyebrow" x="650" y="170" fill="#C9A97C">RECENTLY BUILT</text>
    <text x="650" y="198" font-size="20" font-weight="700" fill="#F5EFE4" letter-spacing="-0.4">Admin Trace</text>
  </g>

  <!-- RIGHT BOTTOM -->
  <g filter="url(#shadow)"><rect x="624" y="236" width="352" height="100" rx="26" fill="#FFFDF9"/></g>
  <g class="sf">
    <text class="eyebrow" x="650" y="270" fill="#9C7A54">OPEN TO</text>
    <text x="650" y="298" font-size="16" font-weight="600" fill="#1D1B18">AI/ML &amp; Data Scientist roles</text>
    <text x="650" y="320" font-size="13.5" fill="#6E675D">Across Europe · available immediately</text>
  </g>
</svg>
