<svg xmlns="http://www.w3.org/2000/svg" width="310" height="236" viewBox="0 0 310 236" role="img" aria-label="Flight-Fare-Prediction">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1E6"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8B7BC8" flood-opacity="0.16"/>
    </filter>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .rise { animation: rise .8s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

      .card { animation: rise .8s ease-out both; }
      .dot { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    </style>
  </defs>
  <g class="card" filter="url(#s)">
    <rect x="6" y="4" width="298" height="224" rx="20" fill="url(#g)" stroke="#FFD3B3"/>
  </g>
  <circle class="dot" cx="46" cy="44" r="15" fill="#FFD3B3" fill-opacity="0.55"/>
  <path d="M40 40l-5 4 5 4M52 40l5 4-5 4" fill="none" stroke="#9A5A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono" x="70" y="49" font-size="14.5" font-weight="700" fill="#3B3552">Flight-Fare-Prediction</text>
  <text class="sans" x="26" y="94" font-size="13" fill="#6F6888">Power BI dashboard predicting flight</text><text class="sans" x="26" y="113" font-size="13" fill="#6F6888">fares from historical data.</text>
  
  <rect x="26.0" y="184" width="74.8" height="24" rx="12" fill="#FFF1E6" stroke="#FFD3B3"/><text class="mono" x="63.4" y="200" font-size="11" font-weight="600" fill="#9A5A2A" text-anchor="middle">Power BI</text><rect x="108.8" y="184" width="94.6" height="24" rx="12" fill="#FFF1E6" stroke="#FFD3B3"/><text class="mono" x="156.1" y="200" font-size="11" font-weight="600" fill="#9A5A2A" text-anchor="middle">Forecasting</text>
</svg>
